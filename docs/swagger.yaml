basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/models.UserResponse'
    type: object
  models.AccountResponse:
    properties:
      balance:
        type: number
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      type:
        $ref: '#/definitions/models.AccountType'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.AccountType:
    enum:
    - checking
    - savings
    - credit
    - investment
    type: string
    x-enum-varnames:
    - AccountTypeChecking
    - AccountTypeSavings
    - AccountTypeCredit
    - AccountTypeInvestment
  models.CategoryResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.CreateAccountRequest:
    properties:
      balance:
        minimum: 0
        type: number
      currency:
        type: string
      description:
        maxLength: 500
        type: string
      name:
        description: 'Corrigido: removido espaços'
        maxLength: 100
        minLength: 2
        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.AccountType'
        enum:
        - checking
        - savings
        - credit
        - investment
    required:
    - balance
    - currency
    - name
    - type
    type: object
  models.CreateCategoryRequest:
    properties:
      color:
        type: string
      description:
        maxLength: 200
        type: string
      icon:
        maxLength: 50
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - color
    - name
    type: object
  models.CreateReportRequest:
    properties:
      description:
        maxLength: 500
        type: string
      end_date:
        type: string
      start_date:
        type: string
      title:
        maxLength: 100
        minLength: 2
        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.ReportType'
        enum:
        - monthly
        - yearly
        - custom
    required:
    - end_date
    - start_date
    - title
    - type
    type: object
  models.CreateTransactionRequest:
    properties:
      account_id:
        type: string
      amount:
        type: number
      category_id:
        type: string
      date:
        type: string
      description:
        maxLength: 500
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.TransactionStatus'
        enum:
        - pending
        - completed
        - cancelled
      type:
        allOf:
        - $ref: '#/definitions/models.TransactionType'
        enum:
        - income
        - expense
        - transfer
    required:
    - account_id
    - amount
    - date
    - description
    - type
    type: object
  models.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  models.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  models.ReportResponse:
    properties:
      created_at:
        type: string
      data: {}
      description:
        type: string
      end_date:
        type: string
      id:
        type: string
      start_date:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/models.ReportType'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.ReportType:
    enum:
    - monthly
    - yearly
    - custom
    type: string
    x-enum-varnames:
    - ReportTypeMonthly
    - ReportTypeYearly
    - ReportTypeCustom
  models.TransactionResponse:
    properties:
      account_id:
        type: string
      amount:
        type: number
      category_id:
        type: string
      created_at:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: string
      status:
        $ref: '#/definitions/models.TransactionStatus'
      type:
        $ref: '#/definitions/models.TransactionType'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.TransactionStatus:
    enum:
    - pending
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusCompleted
    - StatusCancelled
  models.TransactionType:
    enum:
    - income
    - expense
    - transfer
    type: string
    x-enum-varnames:
    - TransactionIncome
    - TransactionExpense
    - TransactionTransfer
  models.UpdateAccountRequest:
    properties:
      balance:
        minimum: 0
        type: number
      currency:
        type: string
      description:
        maxLength: 500
        type: string
      is_active:
        description: 'Corrigido: sintaxe da tag JSON'
        type: boolean
      name:
        description: 'Corrigido: removido espaços'
        maxLength: 100
        minLength: 2
        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.AccountType'
        enum:
        - checking
        - savings
        - credit
        - investment
    type: object
  models.UpdateCategoryRequest:
    properties:
      color:
        type: string
      description:
        maxLength: 200
        type: string
      icon:
        maxLength: 50
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 50
        minLength: 2
        type: string
    type: object
  models.UpdateTransactionRequest:
    properties:
      account_id:
        type: string
      amount:
        type: number
      category_id:
        type: string
      date:
        type: string
      description:
        maxLength: 500
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.TransactionStatus'
        enum:
        - pending
        - completed
        - cancelled
      type:
        allOf:
        - $ref: '#/definitions/models.TransactionType'
        enum:
        - income
        - expense
        - transfer
    type: object
  models.UpdateUserRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  models.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      updated_at:
        type: string
    type: object
info:
  contact:
    email: dev@gofinance.com
    name: GoFinance Team
  description: API para gestão financeira pessoal.
  title: GoFinance API
  version: "1.0"
paths:
  /accounts:
    get:
      consumes:
      - application/json
      description: Returns all accounts for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AccountResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Creates a new account owned by the authenticated user
      parameters:
      - description: Account payload
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/models.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create account
      tags:
      - accounts
  /accounts/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes an account by its identifier
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete account
      tags:
      - accounts
    get:
      consumes:
      - application/json
      description: Returns account details by its identifier
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AccountResponse'
        "400":
